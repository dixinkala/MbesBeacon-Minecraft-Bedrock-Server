name: CI

on:
  push:
    branches: [ main, develop ]
    # 推送 v* 标签时同样触发构建与发布（release job 依赖此触发）
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  # P3-4：支持手动触发（可跳过 tag 直接构建并发布 Release）
  workflow_dispatch:
    inputs:
      create_release:
        description: "创建 Release（手动发布）"
        type: boolean
        default: false
      release_version:
        description: "Release 版本号（如 v1.0.25）"
        type: string
        default: "v1.0.25"

jobs:
  test:
    name: 测试 (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🐍 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 安装依赖（开发依赖含 pytest/ruff）
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: 🔍 代码格式检查（硬性要求）
      run: |
        ruff format --check .

    - name: 🔍 代码 Lint 检查（硬性要求）
      run: |
        ruff check .

    - name: 🧪 运行测试
      run: |
        pytest tests/ -v --cov=bedrock_server_manager --cov-report=xml --cov-report=term

    - name: 📊 上传覆盖率报告
      uses: actions/upload-artifact@v7
      with:
        # 矩阵里 windows/ubuntu × 3 个 Python 版本共 6 个 job，名字必须带 os 维度
        name: coverage-report-${{ matrix.os }}-${{ matrix.python-version }}
        path: coverage.xml
      # 仅"上传文件"这一步允许失败；覆盖率门禁由 pytest 的 --cov（fail_under）负责
      continue-on-error: true

  frontend:
    name: 前端单元测试（node:test）
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🟩 设置 Node.js
      uses: actions/setup-node@v7
      with:
        # 用 22：`node --test <glob>` 的 glob 支持是 22 才稳定的，
        # 之前 pin 20 与下面的 glob 写法自相矛盾（在 20 上会直接报找不到模块）。
        node-version: "22"

    # 前端无构建步骤、无 npm 依赖：测试直接从 web/index.html 抽取脚本到最小 DOM 桩中执行
    - name: 🧪 运行前端测试
      run: |
        node --test "tests/js/**/*.test.mjs"

  smoke:
    name: Windows 冒烟（真实 HTTP 服务）
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🐍 设置 Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔥 运行冒烟测试
      run: |
        python smoke_test.py

  build:
    name: 构建 EXE
    runs-on: windows-latest
    needs: [test, smoke, frontend]
    # main 分支、v* 标签推送、手动触发都要构建（早期只判 refs/heads/main，
    # 导致 tag 触发的 release job 永远拿不到产物）
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🐍 设置 Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 🔨 构建 EXE
      run: |
        python -m PyInstaller --noconfirm --clean BedrockServerManager.spec

    - name: 📦 上传构建产物
      uses: actions/upload-artifact@v7
      with:
        name: MbesBeacon-windows
        path: dist/MbesBeacon.exe

  release:
    name: 发布 Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
      actions: read

    steps:
    - name: 📥 下载构建产物
      uses: actions/download-artifact@v8
      with:
        name: MbesBeacon-windows
        path: dist

    - name: 🚀 创建 Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
      with:
        files: dist/MbesBeacon.exe
        generate_release_notes: true
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
