name: CI

on:
  push:
    branches: [ main, develop ]
    # 推送 v* 标签时同样触发构建与发布（release job 依赖此触发）
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  # P3-4：支持手动触发（可跳过 tag 直接构建并发布 Release）
  workflow_dispatch:
    inputs:
      create_release:
        description: "创建 Release（手动发布）"
        type: boolean
        default: false
      release_version:
        description: "Release 版本号（如 v1.0.26）"
        type: string
        default: "v1.0.26"

jobs:
  test:
    name: 测试 (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🐍 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 安装依赖（开发依赖含 pytest/ruff）
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: 🔍 代码格式检查（硬性要求）
      run: |
        ruff format --check .

    - name: 🔍 代码 Lint 检查（硬性要求）
      run: |
        ruff check .

    - name: 🧪 运行测试
      run: |
        pytest tests/ -v --cov=bedrock_server_manager --cov-report=xml --cov-report=term --cov-report=json:.coverage.json

    - name: 📏 逐文件覆盖率门槛（重要 85% / 其余 80%）
      # 覆盖率门槛在 Windows 上执行：PE 签名/注册表等 Windows-only 代码
      # 在 Linux 上不可达，按平台统计会造成假失败。
      if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
      run: python tools/check_coverage.py --strict

    - name: 📊 上传覆盖率报告
      uses: actions/upload-artifact@v7
      with:
        # 矩阵里 windows/ubuntu × 3 个 Python 版本共 6 个 job，名字必须带 os 维度
        name: coverage-report-${{ matrix.os }}-${{ matrix.python-version }}
        path: coverage.xml
      # 仅"上传文件"这一步允许失败；覆盖率门禁由 pytest 的 --cov（fail_under）负责
      continue-on-error: true

  frontend:
    name: 前端单元测试（node:test）
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🟩 设置 Node.js
      uses: actions/setup-node@v7
      with:
        # 用 22：`node --test <glob>` 的 glob 支持是 22 才稳定的，
        # 之前 pin 20 与下面的 glob 写法自相矛盾（在 20 上会直接报找不到模块）。
        node-version: "22"

    # 前端无构建步骤、无 npm 依赖：测试直接从 web/index.html 抽取脚本到最小 DOM 桩中执行
    - name: 🧪 运行前端测试
      run: |
        node --test "tests/js/**/*.test.mjs"

  smoke:
    name: Windows 冒烟（真实 HTTP 服务）
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🐍 设置 Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔥 运行冒烟测试
      run: |
        python smoke_test.py

  build:
    name: 构建 EXE
    runs-on: windows-latest
    needs: [test, smoke, frontend]
    # main 分支、v* 标签推送、手动触发都要构建（早期只判 refs/heads/main，
    # 导致 tag 触发的 release job 永远拿不到产物）
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🐍 设置 Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 🔨 构建 EXE
      run: |
        python -m PyInstaller --noconfirm --clean BedrockServerManager.spec

    - name: 📦 上传构建产物
      uses: actions/upload-artifact@v7
      with:
        name: MbesBeacon-windows
        path: dist/MbesBeacon.exe

  release:
    name: 发布 Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
      actions: read

    steps:
    # 追加许可证声明时要读 .github/release-license.md 并调用 gh（需要 git 仓库上下文），
    # 因此必须先 checkout；早期 release job 没 checkout，导致 v1.0.26 首次在 tag 上
    # 执行该步骤时报 "not a git repository"。
    - name: 📥 检出代码（许可证声明文件）
      uses: actions/checkout@v4

    - name: 📥 下载构建产物
      uses: actions/download-artifact@v8
      with:
        name: MbesBeacon-windows
        path: dist

    - name: 🚀 创建 Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
      with:
        files: dist/MbesBeacon.exe
        generate_release_notes: true
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Release 正文必须带 MIT 许可证声明（历史 Release 已统一补齐）。
    # 用 gh 而不是 action 的 append_body：先检查标记再决定是否追加，重复运行不会写两遍。
    - name: 📄 追加 MIT 许可证声明
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_version }}
      run: |
        set -euo pipefail
        body=""
        for attempt in 1 2 3 4 5; do
          if body=$(gh release view "$TAG" --json body --jq .body 2>/dev/null); then
            break
          fi
          echo "Release $TAG 暂不可读，重试第 $attempt 次…"
          sleep 3
        done
        if [ -z "$body" ]; then
          echo "::error::无法读取 Release $TAG 的正文"
          exit 1
        fi
        if printf '%s' "$body" | grep -q '完整条款见 \[LICENSE\]'; then
          echo "Release $TAG 已包含许可证声明，跳过"
          exit 0
        fi
        {
          printf '%s\n\n' "$body"
          cat .github/release-license.md
        } > release_notes_with_license.md
        gh release edit "$TAG" --notes-file release_notes_with_license.md
        echo "已为 Release $TAG 追加 MIT 许可证声明"
