name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          pip install psutil pytest pytest-cov

      - name: 运行测试并生成覆盖率报告
        run: |
          pytest tests/ --cov=bedrock_server_manager --cov-report=xml --cov-report=term-missing --cov-fail-under=70 -v

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

  build:
    name: 构建 EXE
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install psutil pyinstaller

      - name: 构建 EXE
        run: python -m PyInstaller --noconfirm --clean BedrockServerManager.spec

      - name: 数字签名（如果配置了证书）
        if: ${{ secrets.CERT_PFX != '' }}
        run: |
          echo "正在数字签名..."
          signtool sign /f cert.pfx /p ${{ secrets.CERT_PASS }} /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/MbesBeacon.exe
        env:
          CERT_PFX: ${{ secrets.CERT_PFX }}
        continue-on-error: true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MbesBeacon-exe
          path: dist/MbesBeacon.exe
          retention-days: 30

      - name: 创建 GitHub Release（仅 tag 推送时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MbesBeacon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/MbesBeacon.exe
            CHANGELOG.md
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
