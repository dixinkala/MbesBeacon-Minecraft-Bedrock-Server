name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4

    - name: 🐍 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov ruff

    - name: 🔍 代码格式检查
      run: |
        ruff format --check .
      continue-on-error: true

    - name: 🔍 代码 Lint 检查
      run: |
        ruff check .
      continue-on-error: true

    - name: 🧪 运行测试
      run: |
        pytest tests/ -v --cov=bedrock_server_manager --cov-report=xml --cov-report=term

    - name: 📊 上传覆盖率报告
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: coverage.xml
      continue-on-error: true

  build:
    name: 构建 EXE
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4

    - name: 🐍 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 🔨 构建 EXE
      run: |
        python -m PyInstaller --noconfirm --clean BedrockServerManager.spec

    - name: 📦 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: MbesBeacon-windows
        path: dist/MbesBeacon.exe

  release:
    name: 发布 Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: 📥 下载构建产物
      uses: actions/download-artifact@v4
      with:
        name: MbesBeacon-windows
        path: dist

    - name: 🚀 创建 Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/MbesBeacon.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
