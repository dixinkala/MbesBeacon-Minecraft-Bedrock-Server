name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # P3-4：支持手动触发（可跳过 tag 直接构建并发布 Release）
  workflow_dispatch:
    inputs:
      create_release:
        description: "创建 Release（手动发布）"
        type: boolean
        default: false
      release_version:
        description: "Release 版本号（如 v1.0.23）"
        type: string
        default: "v1.0.23"

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🐍 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 安装依赖（开发依赖含 pytest/ruff）
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: 🔍 代码格式检查（硬性要求）
      run: |
        ruff format --check .

    - name: 🔍 代码 Lint 检查（硬性要求）
      run: |
        ruff check .

    - name: 🧪 运行测试
      run: |
        pytest tests/ -v --cov=bedrock_server_manager --cov-report=xml --cov-report=term

    - name: 📊 上传覆盖率报告
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: coverage.xml
      continue-on-error: true

  smoke:
    name: Windows 冒烟（真实 HTTP 服务）
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🐍 设置 Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔥 运行冒烟测试
      run: |
        python smoke_test.py

  build:
    name: 构建 EXE
    runs-on: windows-latest
    needs: [test, smoke]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🐍 设置 Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 🔨 构建 EXE
      run: |
        python -m PyInstaller --noconfirm --clean BedrockServerManager.spec

    - name: 📦 上传构建产物
      uses: actions/upload-artifact@v7
      with:
        name: MbesBeacon-windows
        path: dist/MbesBeacon.exe

  release:
    name: 发布 Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
      actions: read

    steps:
    - name: 📥 下载构建产物
      uses: actions/download-artifact@v8
      with:
        name: MbesBeacon-windows
        path: dist

    - name: 🚀 创建 Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        files: dist/MbesBeacon.exe
        generate_release_notes: true
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
