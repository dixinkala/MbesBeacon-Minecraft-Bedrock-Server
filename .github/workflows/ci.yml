name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🐍 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: 🔍 代码格式检查（硬性要求）
      run: |
        ruff format --check .

    - name: 🔍 代码 Lint 检查（硬性要求）
      run: |
        ruff check .

    - name: 🧪 运行测试
      run: |
        pytest tests/ -v --cov=bedrock_server_manager --cov-report=xml --cov-report=term

    - name: 📊 上传覆盖率报告
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: coverage.xml
      continue-on-error: true

  build:
    name: 构建 EXE
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v7

    - name: 🐍 设置 Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 🔨 构建 EXE
      run: |
        python -m PyInstaller --noconfirm --clean BedrockServerManager.spec

    - name: 📦 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: MbesBeacon-windows
        path: dist/MbesBeacon.exe

  release:
    name: 发布 Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read

    steps:
    - name: 📥 下载构建产物
      uses: actions/download-artifact@v4
      with:
        name: MbesBeacon-windows
        path: dist

    - name: 🚀 创建 Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (2024-09-05)
      with:
        files: dist/MbesBeacon.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
