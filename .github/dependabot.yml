# Dependabot 依赖自动更新配置
# 自动检查依赖安全更新和版本更新
# 官方文档: https://docs.github.com/code-security/dependabot

version: 2
updates:
  # Python 依赖（requirements.txt）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"      # 每周检查一次
      day: "monday"           # 每周一检查
      time: "09:00"           # 北京时间 09:00 (UTC+8)
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # 保持"只屏蔽常规版本升级，安全更新照常提 PR"。
    #
    # 注意：单独的 `dependency-name` 规则会连安全更新一起屏蔽。
    # 显式列出 update_types 后，规则被限定在 version update 路径上
    # （Dependabot 作业日志里会标为 "doesn't apply to security update"），
    # 这样 pyinstaller / ruff 仍会在出现 CVE 时收到安全更新 PR。
    # 参考：dependabot.yml 的 update-types 只影响版本更新，不影响安全更新。
    ignore:
      # PyInstaller 保持锁定，避免打包环境变化
      - dependency-name: "pyinstaller"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # ruff 保持锁定，避免代码风格规则变化
      - dependency-name: "ruff"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # GitHub Actions 工作流
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
